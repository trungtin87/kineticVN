name: Deploy Kinetik Studio to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm ci --legacy-peer-deps
          else
            npm install || npm install --legacy-peer-deps
          fi

      - name: Resolve GitHub Pages base path
        id: base_path
        env:
          CUSTOM_BASE: ${{ vars.PAGES_BASE_PATH }}
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          if [ -n "$CUSTOM_BASE" ]; then
            BASE="$CUSTOM_BASE"
          elif [ "$REPO_NAME" = "${REPO_OWNER}.github.io" ]; then
            BASE="/"
          else
            BASE="/${REPO_NAME}/"
          fi
          case "$BASE" in
            */) ;;
            *) BASE="${BASE}/" ;;
          esac
          echo "VITE_BASE_PATH=$BASE" >> "$GITHUB_OUTPUT"
          echo "Using Vite base path: $BASE"

      - name: Build static site
        env:
          VITE_BASE_PATH: ${{ steps.base_path.outputs.VITE_BASE_PATH }}
          VITE_STATIC_HOST: "true"
        run: npm run build

      - name: Prepare SPA 404 fallback and .nojekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
